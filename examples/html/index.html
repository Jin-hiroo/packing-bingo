<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>修学旅行のしおり（持ちものビンゴのHTMLの例）</title>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; line-height: 1.7; background: #fff; color: #222; }
    main { max-width: 760px; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <h1>修学旅行のしおり</h1>
    <p>持ち物をかばんに入れたら、マスをタップしてください。進み具合はこのブラウザに保存されます。</p>

    <!-- ここから下を、HTMLの好きな場所に貼り付けます -->
    <div id="packing-bingo"></div>
    <script src="https://cdn.jsdelivr.net/npm/packing-bingo@0.3/dist/packing-bingo.global.js"></script>
    <script>
      PackingBingo.createPackingBingo(document.getElementById("packing-bingo"), {
        items: [
          { emoji: "👛", label: "財布" }, { emoji: "📱", label: "スマホ" },
          { emoji: "🔋", label: "モバイル\u200B充電器" }, { emoji: "📋", label: "健康調査票" },
          { emoji: "🪪", label: "マイナカード\u200Bまたは保険証" }, { emoji: "📖", label: "しおり" },
          { emoji: "😷", label: "マスク" }, { emoji: "🤧", label: "ハンカチ" },
          { emoji: "💊", label: "常備薬" }, { emoji: "🛍️", label: "ビニール袋" },
          { emoji: "🧤", label: "軍手（学校支給）" }, { emoji: "🔦", label: "ヘッドライト" },
          { emoji: "👕", label: "ジャージ" }, { emoji: "☔", label: "雨具" },
          { emoji: "🛁", label: "タオル" }, { emoji: "🧴", label: "日焼け止め" },
        ],
      });
    </script>
    <!-- ここまで -->
  </main>
</body>
</html>
